name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main", "lumo"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build with Next.js (Export)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://arteraksa.github.io/lumodesign"
          NEXT_PUBLIC_BASE_PATH: "/lumodesign"
          NEXT_PUBLIC_SUPABASE_URL: "https://yzivkrotylwyglavtnho.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_99D42sJ3fT78ll6EzmIDqg_RWXrgtNn"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
          force_orphan: true
